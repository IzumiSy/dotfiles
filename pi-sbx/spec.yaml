# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Pi with GitHub Copilot
description: Pi using sandbox-local Copilot authentication

build: |
  FROM docker.io/sbx/pi-image:latest
  USER root
  RUN apt-get update \
      && apt-get install -y --no-install-recommends neovim \
      && dpkg --compare-versions "$(dpkg-query -W -f='${Version}' neovim)" ge 0.11.3 \
      && rm -rf /var/lib/apt/lists/*
  COPY --from=ghcr.io/1broseidon/cymbal:v0.18.0 /usr/local/bin/cymbal /usr/local/bin/cymbal
  ENV PI_CLIPBOARD_OSC52=1
  ENV PNPM_HOME=/home/agent/.local/share/pnpm
  ENV PATH="$PNPM_HOME/bin:$PATH"
  USER agent
  RUN curl -fsSL https://get.pnpm.io/install.sh -o /tmp/install-pnpm.sh \
      && PNPM_NO_MODIFY_PATH=1 SHELL=/bin/bash sh /tmp/install-pnpm.sh \
      && rm /tmp/install-pnpm.sh
  RUN cymbal --version && pnpm --version && nvim --version
  COPY --chown=1000:1000 setup-dotfiles.sh /tmp/setup-dotfiles.sh
  COPY --chown=1000:1000 bashrc.sh /home/agent/.bashrc
  ENTRYPOINT ["/bin/bash", "/tmp/setup-dotfiles.sh"]
  CMD []

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - github.com
          - api.github.com
          - release-assets.githubusercontent.com
          - api.mason-registry.dev
          - api.githubcopilot.com
          - api.individual.githubcopilot.com
          - api.business.githubcopilot.com
          - api.enterprise.githubcopilot.com
          - registry.npmjs.org
