# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Pi with GitHub Copilot
description: Pi using sandbox-local Copilot authentication

build: |
  FROM docker.io/sbx/pi-image:latest
  COPY --from=ghcr.io/1broseidon/cymbal:v0.18.0 /usr/local/bin/cymbal /usr/local/bin/cymbal
  ENV PI_CLIPBOARD_OSC52=1
  USER agent
  RUN cymbal --version
  COPY --chown=1000:1000 setup-dotfiles.sh /tmp/setup-dotfiles.sh
  ENTRYPOINT ["/bin/bash", "/tmp/setup-dotfiles.sh"]
  CMD []

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - github.com
          - api.github.com
          - api.githubcopilot.com
          - api.individual.githubcopilot.com
          - api.business.githubcopilot.com
          - api.enterprise.githubcopilot.com
          - registry.npmjs.org
