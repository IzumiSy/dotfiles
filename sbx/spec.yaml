# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Bash with Pi
description: A development shell with dotfiles, Pi, and host-managed Copilot authentication

build: |
  FROM docker.io/sbx/shell-docker-image:latest
  USER root
  RUN apt-get update \
      && apt-get install -y --no-install-recommends git-delta neovim tig peco fd-find \
      && dpkg --compare-versions "$(dpkg-query -W -f='${Version}' neovim)" ge 0.11.3 \
      && ln -sf /usr/bin/fdfind /usr/local/bin/fd \
      && rm -rf /var/lib/apt/lists/*
  RUN --mount=type=tmpfs,target=/tmp bash -o pipefail -c \
      'curl -fsSL https://starship.rs/install.sh | sh -s -- --yes --version v1.27.0'
  COPY --from=ghcr.io/1broseidon/cymbal:v0.18.0 /usr/local/bin/cymbal /usr/local/bin/cymbal
  ENV PI_CLIPBOARD_OSC52=1
  ENV NVM_DIR=/home/agent/.nvm
  ENV PNPM_HOME=/home/agent/.local/share/pnpm
  ENV PATH="$PNPM_HOME/bin:$PATH"
  USER agent
  WORKDIR /home/agent
  RUN npm install -g @earendil-works/pi-coding-agent pnpm
  RUN bash -o pipefail -c \
      'curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh | PROFILE=/dev/null bash'
  COPY --chown=1000:1000 configure-copilot.mjs /tmp/configure-copilot.mjs
  COPY --chown=1000:1000 entrypoint.sh /tmp/entrypoint.sh
  COPY --chown=1000:1000 bashrc.sh /home/agent/.bashrc
  # sbx already supplies init; do not wrap its session command in Tini.
  ENTRYPOINT ["/bin/bash", "/tmp/entrypoint.sh"]
  CMD []

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/ssh-agent@1
    config:
      phase: runtime
      unrestricted: false
      authenticate:
        - git@github.com
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - nodejs.org
          - github.com
          - '*.github.com'
          - '*.githubusercontent.com'
          - api.mason-registry.dev
          - '*.githubcopilot.com'
          - 'api.*.githubcopilot.com'
          - npmjs.com
          - '*.npmjs.org'
          - unpkg.com
          - api.tailor.tech
          - base-ui.com
          - api.fireflies.ai
          - react.dev
          - '*.react.dev'
          - w3.org
          - '*.w3.org'
          - developer.mozilla.org
          - '*.developer.mozilla.org'
          - docs.tailor.tech
