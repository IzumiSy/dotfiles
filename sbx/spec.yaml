# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Bash with Pi
description: A development shell with dotfiles, Pi, and host-managed Copilot authentication

args:
  copilot_host:
    required: true
    pattern: '^api\.([a-z0-9-]+\.)?githubcopilot\.com$'
    description: Copilot API host resolved by the host Pi token

build: |
  FROM docker.io/sbx/shell-docker-image:latest

  # System CLI tools.
  USER root
  RUN apt-get update \
      && apt-get install -y --no-install-recommends git-delta neovim tig peco fd-find \
      && dpkg --compare-versions "$(dpkg-query -W -f='${Version}' neovim)" ge 0.11.3 \
      && ln -sf /usr/bin/fdfind /usr/local/bin/fd \
      && rm -rf /var/lib/apt/lists/*
  RUN --mount=type=tmpfs,target=/tmp bash -o pipefail -c \
      'curl -fsSL https://starship.rs/install.sh | sh -s -- --yes --version v1.27.0'
  COPY --from=ghcr.io/1broseidon/cymbal:v0.18.0 /usr/local/bin/cymbal /usr/local/bin/cymbal

  # Reuse Playwright's browser image on both Linux ARM64 and AMD64.
  COPY --from=mcr.microsoft.com/playwright:v1.64.1-noble /ms-playwright/chromium-* /opt/chromium/
  RUN --mount=type=tmpfs,target=/root/.npm NPM_CONFIG_PREFIX=/usr/local npx --yes playwright@1.64.1 install-deps chromium \
      && ln -s /opt/chromium/chrome-linux*/chrome /usr/local/bin/chromium \
      && chromium --version \
      && rm -rf /var/lib/apt/lists/*

  # Runtime environment.
  ENV AGENT_BROWSER_EXECUTABLE_PATH=/usr/local/bin/chromium
  ENV PI_CLIPBOARD_OSC52=1
  ENV NVM_DIR=/home/agent/.nvm
  ENV PNPM_HOME=/home/agent/.local/share/pnpm
  ENV PATH="$PNPM_HOME/bin:$PATH"

  # Global CLI tools use the base image's Node.js.
  USER agent
  WORKDIR /home/agent
  RUN npm install -g @earendil-works/pi-coding-agent pnpm agent-browser

  # nvm bootstrap, Node.js LTS versions, then Krypton as the default.
  RUN bash -o pipefail -c \
      'unset NPM_CONFIG_PREFIX \
      && curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh | PROFILE=/dev/null bash \
      && source "$NVM_DIR/nvm.sh" \
      && nvm install lts/jod \
      && nvm install lts/krypton \
      && nvm install lts/lithium \
      && nvm alias default lts/krypton \
      && nvm use default'

  # Shell startup and host-proxied Copilot configuration.
  COPY loopback-proxy.mjs /opt/loopback-proxy.mjs
  COPY --chown=1000:1000 configure-copilot.mjs /tmp/configure-copilot.mjs
  COPY --chown=1000:1000 entrypoint.sh /tmp/entrypoint.sh
  COPY --chown=1000:1000 bashrc.sh /home/agent/.bashrc
  # sbx already supplies init; do not wrap its session command in Tini.
  ENTRYPOINT ["/bin/bash", "/tmp/entrypoint.sh"]
  CMD []

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/credential@1
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - domain: api.github.com
            header: Authorization
            format: "Bearer %s"
          - domain: github.com
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/credential@1
    config:
      service: pi-copilot
      phase: runtime
      apiKey:
        name: COPILOT_GITHUB_TOKEN
        proxyManaged: true
        inject:
          - domain: '${{ kit.args.copilot_host }}'
            header: Authorization
            format: "Bearer %s"

  # Bridge localhost listeners; host publication remains explicit through sb map.
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: [sh, -c, 'exec node /opt/loopback-proxy.mjs >> /home/agent/loopback-proxy.log 2>&1']
          user: "1000"
          background: true

  # Restrict host SSH-agent authentication to GitHub.
  - type: com.docker.sandbox/ssh-agent@1
    config:
      phase: runtime
      unrestricted: false
      authenticate:
        - git@github.com

  # Runtime outbound network allowlist.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Kit v3 requires exact allow entries for inject domains, even when wildcards cover them.
          - api.github.com
          # Copilot API host resolved from the host Pi token, passed via --kit-arg, and used for credential injection.
          - '${{ kit.args.copilot_host }}'
          - nodejs.org
          - github.com
          - '**.github.com'
          - '*.githubusercontent.com'
          - api.mason-registry.dev
          - '**.githubcopilot.com'
          - npmjs.com
          - '*.npmjs.org'
          - unpkg.com
          - '**.tailor.tech'
          - base-ui.com
          - api.fireflies.ai
          - react.dev
          - '*.react.dev'
          - w3.org
          - '*.w3.org'
          - developer.mozilla.org
          - '*.developer.mozilla.org'
          - '**.google.com'
          - '**.googleapis.com'
          - '**.erp.dev'
          - pi.dev
          - buf.build
