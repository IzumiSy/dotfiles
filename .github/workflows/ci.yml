name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The disposable runner VM is the CI isolation boundary, not sbx.
      - name: Check Bash syntax and run tests
        run: /bin/bash tests/run
