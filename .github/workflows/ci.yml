name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: |
          for file in setup _bashrc bash/*.sh pi-sbx/*.sh tests/*.sh; do
            /bin/bash -n "$file"
          done
      - name: Run tests
        run: |
          for file in tests/*.sh; do
            echo "Running $file"
            /bin/bash "$file"
          done
